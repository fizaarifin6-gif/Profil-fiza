<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Siswa</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(
        -45deg,
        #ff9ed8,
        #ffc7ea,
        #87cefa,
        #6ec6ff
    );
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    padding:20px;
    position:relative;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Bunga */
.flower{
    position:absolute;
    font-size:28px;
    opacity:0.8;
    animation:float 10s linear infinite;
    z-index:0;
}

@keyframes float{
    0%{
        transform:translateY(110vh) rotate(0deg);
    }
    100%{
        transform:translateY(-120px) rotate(360deg);
    }
}

header{
    margin-bottom:25px;
    text-align:center;
    animation:fadeDown 1s ease;
    z-index:2;
}

header h1{
    font-size:38px;
    color:white;
    text-transform:uppercase;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ff69b4,
        0 0 40px #87cefa;
}

header p{
    color:#fff;
    margin-top:8px;
    font-size:15px;
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes blink{
    0%,100%{
        box-shadow:
            0 0 10px #fff,
            0 0 20px #ff69b4,
            0 0 40px #87cefa;
    }
    50%{
        box-shadow:
            0 0 5px #fff,
            0 0 10px #ff69b4,
            0 0 20px #87cefa;
    }
}

.card{
    width:380px;
    padding:30px;
    border-radius:25px;
    text-align:center;
    color:white;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px);
    border:2px solid rgba(255,255,255,0.2);
    animation:blink 1.5s infinite;
    z-index:2;
}

.profile-img{
    width:130px;
    height:130px;
    border-radius:50%;
    border:4px solid white;
    object-fit:cover;
    margin-bottom:15px;
}

.card h2{
    font-size:30px;
    margin-bottom:10px;
}

.desc{
    font-size:15px;
    line-height:1.8;
}

.quote{
    margin-top:20px;
    font-style:italic;
    font-size:14px;
    color:#ffe6f5;
}

.social{
    margin-top:25px;
}

.social a{
    text-decoration:none;
    color:white;
    font-size:28px;
    margin:0 12px;
    transition:0.3s;
}

.social a:hover{
    color:#ffe4f2;
    transform:scale(1.2);
}
</style>
</head>

<body>

<!-- Bunga -->
<div class="flower" style="left:5%;animation-delay:0s;">🌸</div>
<div class="flower" style="left:15%;animation-delay:2s;">🌷</div>
<div class="flower" style="left:25%;animation-delay:4s;">🌼</div>
<div class="flower" style="left:35%;animation-delay:1s;">🌸</div>
<div class="flower" style="left:45%;animation-delay:3s;">🌷</div>
<div class="flower" style="left:55%;animation-delay:5s;">🌸</div>
<div class="flower" style="left:65%;animation-delay:2s;">🌼</div>
<div class="flower" style="left:75%;animation-delay:4s;">🌸</div>
<div class="flower" style="left:85%;animation-delay:1s;">🌷</div>
<div class="flower" style="left:95%;animation-delay:3s;">🌸</div>

<header>
    <h1>Profile Diri Siswa</h1>
    <p>+ Kreatif Modern Informatika +</p>
</header>

<div class="card">
    <img src="197b5a5f48108be29a54994b95a37bd6_0.jpeg" alt="Foto Profil" class="profile-img">

    <h2>Nur Afiza Fadia Putri</h2>

    <div class="desc">
        <p><b>Kelas:</b> XA Keperawatan</p>
        <p><b>Sekolah:</b> SMKS Kesehatan Yannas Husada Bangkalan</p>
        <p><b>Hobi:</b> Membaca Novel</p>
    </div>

    <div class="quote">
        "Harus semangat belajar agar mendapat nilai memuaskan."
    </div>

    <div class="social">
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-tiktok"></i></a>
        <a href="#"><i class="fab fa-whatsapp"></i></a>
        <a href="#"><i class="fab fa-github"></i></a>
    </div>
</div>

</body>
</html>
